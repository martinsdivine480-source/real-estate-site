<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LuxeEstate Portal{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-warning" href="{{ url_for('home') }}">
                <i class="bi bi-house-heart-fill me-2"></i>LuxeEstate
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item mx-2">
                        <a class="nav-link {% if request.endpoint == 'home' %}active fw-bold text-warning{% endif %}" href="{{ url_for('home') }}">Home</a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link {% if request.endpoint == 'listings' %}active fw-bold text-warning{% endif %}" href="{{ url_for('listings') }}">All Properties</a>
                    </li>
                    <li class="nav-item ms-3">
                        <a href="mailto:marinsdivine480@gmail.com" class="btn btn-warning text-dark fw-semibold px-4">Contact Agent</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center">
        <div class="container">
            <p class="mb-2 fw-bold text-white fs-5"><i class="bi bi-house-heart-fill text-warning me-2"></i>LuxeEstate Portal</p>
            <p class="mb-3 text-muted">Direct Agent Inquiries: <a href="mailto:marinsdivine480@gmail.com" class="text-warning text-decoration-none">marinsdivine480@gmail.com</a></p>
            <p class="small text-secondary mb-0">&copy; 2026 LuxeEstate. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
