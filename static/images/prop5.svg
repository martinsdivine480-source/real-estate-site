<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3e5151"/>
      <stop offset="100%" stop-color="#decba4"/>
    </linearGradient>
    <linearGradient id="roof5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#333333"/>
    </linearGradient>
  </defs>
  <!-- Sky background -->
  <rect width="800" height="600" fill="url(#bg5)"/>
  <!-- Decorative sun/glow -->
  <circle cx="680" cy="120" r="50" fill="#fff" opacity="0.15"/>
  <!-- Ground -->
  <rect y="440" width="800" height="160" fill="#2c5e1a"/>
  
  <!-- Modern architectural house body -->
  <rect x="180" y="200" width="440" height="260" fill="#f8f9fa" rx="12"/>
  <polygon points="140,200 400,80 660,200" fill="url(#roof5)"/>
  
  <!-- Large glass windows / panels -->
  <rect x="220" y="240" width="100" height="140" fill="#00d2ff" opacity="0.7" rx="6"/>
  <rect x="480" y="240" width="100" height="140" fill="#00d2ff" opacity="0.7" rx="6"/>
  
  <!-- Door -->
  <rect x="360" y="320" width="80" height="140" fill="#5c4033" rx="4"/>
  <circle cx="420" cy="390" r="6" fill="#ffd700"/>
  
  <!-- Property Title & Price Overlay -->
  <rect x="40" y="40" width="720" height="70" fill="#000000" opacity="0.65" rx="12"/>
  <text x="65" y="85" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold">Lakeside Luxury Estate</text>
  <text x="650" y="85" fill="#ffd700" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="end">$2,750,000</text>
</svg>